services:
  # Strict read-only MCP on the shared FalkorDB from the graph-db-poc compose.
  # Pass docs/graph-db-poc/compose/docker-compose.yml first so `falkordb` exists
  # and both MCP services share one Compose network.
  osdu-mcpserver-ro:
    image: falkordb/mcpserver:1.3.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      NODE_ENV: production
      MCP_TRANSPORT: http
      MCP_PORT: "8080"
      FALKORDB_HOST: falkordb
      FALKORDB_PORT: "6379"
      FALKORDB_DEFAULT_READONLY: "true"
      FALKORDB_STRICT_READONLY: "true"
    depends_on:
      falkordb:
        condition: service_healthy
