services:
  synthetic-data:
    build:
      context: ../..
      dockerfile: synthetic-data/Dockerfile
    ports:
      - "18090:8090"

  format-adapters:
    build: .
    ports:
      - "18080:8080"
    environment:
      PORT: "8080"
      SEGY_BASE_URL: "http://synthetic-data:8090"
      WITSML_BASE_URL: "http://synthetic-data:8090"
      SCADA_BASE_URL: "http://synthetic-data:8090"
    depends_on:
      - synthetic-data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket; s=socket.create_connection(('127.0.0.1',8080),3); s.close()",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
