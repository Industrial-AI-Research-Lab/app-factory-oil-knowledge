services:
  csv:
    build: .
    ports:
      - "127.0.0.1:18081:8080"
    environment:
      PORT: "8080"
      CSV_ALLOWED_HOSTS: "${CSV_ALLOWED_HOSTS:-}"
      CSV_ALLOWED_S3_BUCKETS: "${CSV_ALLOWED_S3_BUCKETS:-}"
      S3_RESULT_BUCKET: "${S3_RESULT_BUCKET:-}"
      S3_RESULT_PREFIX: "${S3_RESULT_PREFIX:-}"
      # S3 credentials/endpoint for boto3 (read from host .env, never baked
      # into the image). NOTE: compose only injects variables listed here;
      # a bare .env does NOT reach the container by itself.
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:-}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:-}"
      AWS_ENDPOINT_URL: "${AWS_ENDPOINT_URL:-}"
      AWS_DEFAULT_REGION: "${AWS_DEFAULT_REGION:-}"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    pids_limit: 128
    mem_limit: 256m
    cpus: 1.0
    # Liveness only, not readiness: TCP connect proves the port accepts
    # connections, it does not verify MCP tools or data readiness.
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket; s=socket.create_connection(('127.0.0.1',8080),3); s.close()",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
